name: Main 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # netlink is Linux-only, but this ensures that netlink builds
          # without error on macOS, which helps catch missing build tags.
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.23

    - name: Build
      run: go build ./...

    - name: Test (Linux)
      if: runner.os == 'Linux'
      run: |
        ./.github/scripts/modprobe.sh
        go test -exec 'sudo --preserve-env=CI,PATH -n' -v ./ ./nl

    - name: Test (non-Linux)
      if: runner.os != 'Linux'
      run: go test ./...
