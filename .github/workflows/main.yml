name: Main 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          # netlink is Linux-only, but this ensures that netlink builds
          # without error on macOS, which helps catch missing build tags.
          - macos-latest
        go: [stable]
        include:
          # Oldest supported Go version (as per go.mod).
          - os: ubuntu-24.04
            go: go.mod
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
        go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

    - name: Build
      run: go build ./...

    - name: Test (Linux)
      if: runner.os == 'Linux'
      run: |
        ./.github/scripts/modprobe.sh
        go test -exec 'sudo --preserve-env=CI,PATH -n' -v ./ ./nl

    - name: Test (non-Linux)
      if: runner.os != 'Linux'
      run: go test ./...
